name: portagecybertech-jenkins

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc/jenkins.yaml
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:?Set JENKINS_ADMIN_ID in ci/jenkins/.env}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Set JENKINS_ADMIN_PASSWORD in ci/jenkins/.env}
      JENKINS_URL: ${JENKINS_URL:-http://localhost:8081/}
      GIT_REPOSITORY_URL: ${GIT_REPOSITORY_URL:-https://github.com/sylvose-allogo/portagecybertech.git}
      GIT_BRANCH: ${GIT_BRANCH:-main}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - jenkins-home:/var/jenkins_home
      - ./casc:/var/jenkins_home/casc:ro
    networks:
      - jenkins-control
    restart: unless-stopped

networks:
  jenkins-control:
    driver: bridge

volumes:
  jenkins-home:
