openapi: 3.0.3
info:
  title: Portage CyberTech Authorization Server API
  version: 1.0.0
  description: >
    OAuth 2.0 token issuance, RFC 8693 token exchange, and public JWKS
    distribution. The service signs five-minute RS256 JWTs with the configured
    issuer, an allow-listed API audience, and granted scopes. Token exchange
    verifies source-token signature, expiration, issuer, audience, and scopes.
    The checked-in application.properties currently enables the caller-supplied
    subject grant by default. This grant does not authenticate the supplied
    subject and must be explicitly disabled with
    OAUTH_SUBJECT_GRANT_ENABLED=false outside an isolated local demonstration.
    A known local-demo OAUTH_CLIENT_SECRET value is also present in the
    properties file; inject a unique managed secret before sharing or deploying.
servers:
  - url: http://localhost:9090
    description: Local Authorization Server
tags:
  - name: OAuth2
    description: OAuth 2.0 token endpoints
  - name: JWKS
    description: Public signing keys
  - name: Operations
    description: Health and operational endpoints
paths:
  /oauth2/token:
    post:
      tags: [OAuth2]
      operationId: issueOrExchangeAccessToken
      summary: Issue or exchange an access token
      description: >
        Authenticates the confidential client using HTTP Basic. Supports the
        RFC 8693 token-exchange grant and the local demonstration subject
        grant. The checked-in application.properties sets
        OAUTH_SUBJECT_GRANT_ENABLED=true unless it is overridden. Force it to
        false in every shared, staging or production environment. For exchange,
        source JWT signature keys come
        from OAUTH_SUBJECT_TOKEN_JWKS_URI (or the local signing key);
        OAUTH_SUBJECT_TOKEN_ISSUER and OAUTH_API_AUDIENCE validate source claims.
        Requested scopes must exist on both source token and client. The output
        audience must be present in OAUTH_ALLOWED_AUDIENCES.
      security:
        - agentClient: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: "#/components/schemas/SubjectGrantRequest"
                - $ref: "#/components/schemas/TokenExchangeRequest"
            examples:
              localSubjectGrant:
                summary: Local demonstration grant (enabled by the checked-in application.properties)
                value:
                  grant_type: urn:portagecybertech:oauth:grant-type:subject
                  subject: copilot-agent
                  scope: api.read
              rfc8693TokenExchange:
                summary: Exchange a verified source JWT
                value:
                  grant_type: urn:ietf:params:oauth:grant-type:token-exchange
                  subject_token: eyJhbGciOiJSUzI1NiIsImtpZCI6ImV4YW1wbGUifQ.eyJzdWIiOiJjb3BpbG90LWFnZW50In0.signature
                  subject_token_type: urn:ietf:params:oauth:token-type:access_token
                  requested_token_type: urn:ietf:params:oauth:token-type:access_token
                  audience: http://localhost:8080/api
                  scope: api.read
      responses:
        "200":
          description: Access token issued successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: >
            OAuth error response. invalid_grant for an invalid source JWT,
            invalid_request for malformed parameters or a disallowed audience,
            invalid_scope for scopes not allowed by source token and client,
            and unauthorized_client when the client cannot use the grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuth2Error"
        "401":
          description: Client authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuth2Error"
  /oauth2/jwks:
    get:
      tags: [JWKS]
      operationId: getSigningKeys
      summary: Retrieve public signing keys
      description: >
        Returns the public keys used to verify JWT signatures. Private key
        parameters are never published.
      security: []
      responses:
        "200":
          description: JSON Web Key Set containing public verification keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonWebKeySet"
  /actuator/health:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Check service health
      security: []
      responses:
        "200":
          description: Application is healthy
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  securitySchemes:
    agentClient:
      type: http
      scheme: basic
      description: Confidential client; configure credentials through a secret store.
  schemas:
    SubjectGrantRequest:
      type: object
      required: [grant_type, subject]
      properties:
        grant_type:
          type: string
          enum: [urn:portagecybertech:oauth:grant-type:subject]
        subject:
          type: string
          minLength: 1
          maxLength: 200
          description: Caller-provided subject; this grant is only for local demos.
          example: copilot-agent
        scope:
          type: string
          example: api.read
    TokenExchangeRequest:
      type: object
      required: [grant_type, subject_token, subject_token_type]
      properties:
        grant_type:
          type: string
          enum: [urn:ietf:params:oauth:grant-type:token-exchange]
        subject_token:
          type: string
          description: Source JWT that must pass the configured signature and claim validation.
        subject_token_type:
          type: string
          enum: [urn:ietf:params:oauth:token-type:access_token]
        requested_token_type:
          type: string
          enum: [urn:ietf:params:oauth:token-type:access_token]
        audience:
          type: string
          description: Must be included in OAUTH_ALLOWED_AUDIENCES.
          example: http://localhost:8080/api
        scope:
          type: string
          description: Requested scopes must be present in the source token and registered client.
          example: api.read
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: Signed JWT access token.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          format: int64
          example: 300
        scope:
          type: string
          example: api.read
        issued_token_type:
          type: string
          example: urn:ietf:params:oauth:token-type:access_token
    OAuth2Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_client, invalid_grant, unauthorized_client, invalid_scope]
          example: invalid_grant
        error_description:
          type: string
      description: >
        Token endpoint errors use HTTP 401 for invalid_client and HTTP 400 for
        invalid_request, invalid_grant, unauthorized_client, and invalid_scope.
    JsonWebKeySet:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/RsaJsonWebKey"
    RsaJsonWebKey:
      type: object
      required: [kty, use, kid, alg, n, e]
      properties:
        kty:
          type: string
          enum: [RSA]
        use:
          type: string
          example: sig
        kid:
          type: string
          description: Key identifier matching the JWT header kid.
          example: authorization-12345678
        alg:
          type: string
          example: RS256
        n:
          type: string
          description: Base64url-encoded RSA modulus.
        e:
          type: string
          description: Base64url-encoded RSA public exponent.
